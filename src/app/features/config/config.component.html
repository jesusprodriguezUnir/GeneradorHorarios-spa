<div class="lec-fade-up">
  <div style="margin-bottom:24px">
    <h1 style="font-size:var(--text-2xl);font-weight:800;letter-spacing:-0.02em">Configuración del colegio</h1>
    <p style="color:var(--muted-foreground);margin-top:4px;font-size:var(--text-sm)">
      Datos del centro, jornada y recursos del generador de horarios
    </p>
  </div>

  <!-- Tabs -->
  <div class="tabs-bar thin-scroll">
    @for (t of tabs; track t.id) {
      <button class="tab-btn" [class.tab-btn--active]="activeTab() === t.id" (click)="activeTab.set(t.id)" [attr.data-testid]="'config-tab-' + t.id">
        {{ t.label }}
        @if (count(t.id) > 0) {
          <span class="tab-count">{{ count(t.id) }}</span>
        }
      </button>
    }
  </div>

  <!-- Contenido -->
  <div style="margin-top:16px">
    @switch (activeTab()) {

      @case ('school') {
        <app-school-section
          [school]="school()"
          [schoolStages]="stages()"
          (schoolChange)="onSchoolChange($event)"
          (goCiclos)="goToCiclos()" />
      }

      @case ('ciclos') {
        <app-ciclos-section
          [school]="school()"
          (schoolChange)="school.set($event)" />
      }

      @case ('teachers') {
        <div class="lec-card" style="padding:0;overflow:hidden">
          <app-teachers-section
            [teachers]="teachers()"
            [stages]="stages()"
            (teachersChange)="teachers.set($event)" />
        </div>
      }

      @case ('groups') {
        <div class="lec-card" style="padding:0;overflow:hidden">
          <app-groups-section
            [groups]="groups()" (groupsChange)="groups.set($event)"
            [teachers]="teachers()"
            [classrooms]="classrooms()"
            [subjects]="subjects()"
            [school]="school()" />
        </div>
      }

      @case ('subjects') {
        <div class="lec-card" style="padding:0;overflow:hidden">
          <app-subjects-section [subjects]="subjects()" (subjectsChange)="subjects.set($event)" />
        </div>
      }

      @case ('classrooms') {
        <div class="lec-card" style="padding:0;overflow:hidden">
          <app-classrooms-section [classrooms]="classrooms()" (classroomsChange)="classrooms.set($event)" />
        </div>
      }

    }
  </div>
</div>
